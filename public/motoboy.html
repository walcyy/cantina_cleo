<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Motoboy</title>
    <style>
        /* TEMA ESCURO */
        body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 15px; margin: 0; }
        
        .header-moto { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .titulo { font-size: 1.5em; font-weight: bold; color: #ffc107; }
        
        /* CARD PEDIDO */
        .card-moto { 
            background: #1e1e1e; border-radius: 12px; padding: 15px; margin-bottom: 30px; 
            border-left: 10px solid #17a2b8; box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        
        .em-rota { border-left-color: #007bff; background: #2c3e50; border: 2px solid #007bff; }

        .info-cliente { font-size: 1.3em; font-weight: bold; margin-bottom: 5px; color: #fff; }
        .endereco { color: #ccc; margin-bottom: 10px; font-size: 1.1em; display: flex; align-items: start; gap: 5px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        /* MAPA EMBUTIDO */
        .mapa-container {
            width: 100%; height: 250px; background: #000; border-radius: 8px; margin: 10px 0;
            overflow: hidden; border: 1px solid #444; position: relative;
        }
        .mapa-frame { width: 100%; height: 100%; border: 0; }
        
        .detalhes-pgt { 
            background: #333; padding: 10px; border-radius: 8px; margin: 10px 0; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .valor-total { font-size: 1.4em; color: #28a745; font-weight: bold; }
        .forma-pgt { background: #fff; color: #000; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9em; }

        .botoes-acao { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        
        /* BOTÃO WAZE (AZUL CLARO) */
        .btn-waze { 
            background: #33ccff; color: #000; border: none; padding: 12px; 
            border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; 
            text-decoration: none; display: flex; justify-content: center; 
            align-items: center; gap: 5px; font-size: 1.1em; 
        }
        
        .btn-zap { background: #25d366; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; text-decoration: none; display: flex; justify-content: center; align-items: center; gap: 5px; font-size: 1.1em; }
        
        .btn-status { grid-column: span 2; padding: 18px; border: none; border-radius: 8px; font-size: 1.3em; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; margin-top: 10px; }
        
        .btn-indo { background: #007bff; }
        .btn-entregue { background: #28a745; }

    </style>
</head>
<body>

    <div class="header-moto">
        <div class="titulo">🛵 Minhas Entregas</div>
        <button onclick="location.reload()" style="background:#333; color:white; border:none; padding:10px; border-radius:5px;">↻</button>
    </div>

    <div id="lista-entregas" style="text-align:center; margin-top:50px;">Carregando...</div>

    <script>
        setInterval(buscarEntregas, 10000); 
        buscarEntregas();

        async function buscarEntregas() {
            try {
                const res = await fetch('/get_pedidos');
                const pedidos = await res.json();
                
                const meusPedidos = pedidos.filter(p => p.status === 'Saiu para Entrega' || p.status === 'Em Rota');
                
                const div = document.getElementById('lista-entregas');
                div.innerHTML = '';

                if(meusPedidos.length === 0) {
                    div.innerHTML = '<p style="color:#777;">Nenhuma entrega pendente.</p>';
                    return;
                }

                meusPedidos.forEach(p => {
                    const nome = p.nome_cliente ? p.nome_cliente.split(' ')[0] : 'Cliente';
                    const numLimpo = p.telefone ? p.telefone.replace(/\D/g, '') : '';
                    const linkZap = numLimpo ? `https://wa.me/55${numLimpo}` : '#';
                    
                    // --- LINK DO WAZE ---
                    // "navigate=yes" força o Waze a traçar a rota imediatamente
                    const linkWaze = `https://waze.com/ul?q=${encodeURIComponent(p.endereco)}&navigate=yes`;
                    
                    // URL para o Mapa Visual (Google Maps Embed - Visualização rápida)
                    const mapaEmbed = `https://maps.google.com/maps?q=${encodeURIComponent(p.endereco)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;

                    let botaoAcao = '';
                    let classeExtra = '';
                    
                    if(p.status === 'Saiu para Entrega') {
                        botaoAcao = `<button class="btn-status btn-indo" onclick="mudarStatus(${p.id}, 'Em Rota')">🚀 INICIAR ROTA</button>`;
                    } else {
                        classeExtra = 'em-rota';
                        botaoAcao = `<button class="btn-status btn-entregue" onclick="mudarStatus(${p.id}, 'Entregue')">✅ FINALIZAR</button>`;
                    }

                    div.innerHTML += `
                        <div class="card-moto ${classeExtra}" style="text-align:left;">
                            <div class="info-cliente">#${p.id} - ${nome}</div>
                            
                            <div class="endereco">
                                📍 ${p.endereco || 'Sem endereço'}
                            </div>

                            <div class="mapa-container">
                                <iframe class="mapa-frame" src="${mapaEmbed}"></iframe>
                            </div>

                            <div style="display:flex; gap:10px; margin-bottom:10px;">
                                <a href="${linkWaze}" target="_blank" class="btn-waze">🚙 Abrir Waze</a>
                                <a href="${linkZap}" target="_blank" class="btn-zap">📞 Zap</a>
                            </div>

                            <div class="detalhes-pgt">
                                <span class="forma-pgt">${p.forma_pagamento}</span>
                                <span class="valor-total">R$ ${parseFloat(p.valor_total).toFixed(2)}</span>
                            </div>
                            
                            ${p.observacao ? `<div style="background:#444; padding:5px; border-radius:4px; margin-bottom:10px; color:#ffc107;">⚠️ Obs: ${p.observacao}</div>` : ''}

                            <div class="botoes-acao">
                                ${botaoAcao}
                            </div>
                        </div>
                    `;
                });

            } catch(e) { console.log(e); }
        }

        async function mudarStatus(id, novoStatus) {
            if(!confirm(novoStatus === 'Em Rota' ? 'Iniciar rota para este cliente?' : 'Confirmar entrega realizada?')) return;
            
            await fetch(`/pedido/${id}/status`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ novoStatus: novoStatus })
            });
            buscarEntregas();
        }
    </script>
</body>
</html>
